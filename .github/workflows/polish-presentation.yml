name: polish-presentation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[auto-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply presentation polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<span class="slide-counter"><span id="currentSlideNum">1</span> / 6</span>', '<span class="slide-counter"><span id="currentSlideNum">1</span> / 7</span>')

          marker = '    <div class="modal-overlay" id="detailModal" onclick="closeModalOnOutsideClick(event)"></div>'
          closing_slide = '''
        <div class="slide closing-slide" id="slide-7">
            <div class="closing-orbit" aria-hidden="true"></div>
            <div class="closing-content">
                <p class="slide-subtitle reveal-item delay-1" style="justify-content:center;">Penutup</p>
                <h2 class="slide-title reveal-item delay-2 closing-title">Terima <span>Kasih</span></h2>
                <p class="reveal-item delay-3 closing-text">Semoga materi K3LH ini dapat diterapkan untuk menciptakan lingkungan kerja yang aman, sehat, nyaman, dan bertanggung jawab.</p>
                <div class="closing-line reveal-item delay-4"></div>
                <p class="reveal-item delay-5 closing-note">K3LH · Keselamatan dimulai dari kita.</p>
            </div>
        </div>
'''
          if 'id="slide-7"' not in s:
              s = s.replace(marker, closing_slide + '\n' + marker, 1)

          css_marker = '    </style>'
          css = r'''

        /* polish: smoother slide/parallax motion */
        .slide {
            --mx: 0px;
            --my: 0px;
            transform: translate3d(0,0,0);
            will-change: opacity, transform;
            backface-visibility: hidden;
        }

        .slide::before {
            content: '';
            position: absolute;
            inset: -15%;
            pointer-events: none;
            background: radial-gradient(circle at calc(50% + var(--mx)) calc(45% + var(--my)), rgba(212,175,55,.07), transparent 34%);
            transform: translate3d(0,0,0);
            transition: background-position .12s linear;
            z-index: -1;
        }

        .reveal-item {
            will-change: opacity, transform;
            transition-timing-function: cubic-bezier(.22, 1, .36, 1);
        }

        .slide.slide-enter-next { animation: slideEnterNext .72s cubic-bezier(.22, 1, .36, 1) both; }
        .slide.slide-enter-prev { animation: slideEnterPrev .72s cubic-bezier(.22, 1, .36, 1) both; }

        @keyframes slideEnterNext {
            from { opacity: 0; transform: translate3d(38px, 0, 0) scale(.985); }
            to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }
        @keyframes slideEnterPrev {
            from { opacity: 0; transform: translate3d(-38px, 0, 0) scale(.985); }
            to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }

        .closing-slide { text-align: center; align-items: center; overflow: hidden; }
        .closing-content { position: relative; z-index: 2; max-width: 820px; margin: 0 auto; }
        .closing-title { font-size: clamp(4rem, 8vw, 7rem); margin-bottom: 1.2rem; }
        .closing-text { color: var(--text-muted); font-size: 1.12rem; line-height: 1.9; max-width: 720px; margin: 0 auto; }
        .closing-line { width: 90px; height: 1px; background: var(--accent-gold); margin: 35px auto 20px; box-shadow: 0 0 14px var(--accent-glow); }
        .closing-note { color: rgba(255,255,255,.55); font-size: .85rem; letter-spacing: 2px; text-transform: uppercase; }
        .closing-orbit {
            position: absolute; width: min(62vw, 760px); aspect-ratio: 1; border: 1px solid rgba(212,175,55,.08); border-radius: 50%;
            left: 50%; top: 50%; transform: translate3d(-50%,-50%,0); pointer-events:none;
            box-shadow: 0 0 100px rgba(212,175,55,.04), inset 0 0 100px rgba(212,175,55,.025);
        }
        .closing-orbit::after { content:''; position:absolute; width:9px; height:9px; border-radius:50%; background:var(--accent-gold); top:8%; left:50%; box-shadow:0 0 18px var(--accent-gold); }

        @media (prefers-reduced-motion: reduce) {
            .slide, .slide::before, .reveal-item { transition: none !important; animation: none !important; }
        }
'''
          if '/* polish: smoother slide/parallax motion */' not in s:
              s = s.replace(css_marker, css + '\n' + css_marker, 1)

          script_marker = '\n</body>'
          script = r'''

    <script>
        // polish layer: directional transitions + subtle mouse parallax
        (() => {
            const originalUpdateUI = window.updateUI;
            let transitionDirection = 'next';
            let raf = null;

            window.updateUI = function() {
                originalUpdateUI();
                document.querySelectorAll('.slide').forEach(slide => slide.classList.remove('slide-enter-next', 'slide-enter-prev'));
                const active = document.querySelector('.slide.active');
                if (active) {
                    active.classList.add(transitionDirection === 'prev' ? 'slide-enter-prev' : 'slide-enter-next');
                    setTimeout(() => active.classList.remove('slide-enter-next', 'slide-enter-prev'), 760);
                }
            };

            window.nextSlide = function() {
                if (currentSlide < totalSlides - 1 && !isModalOpen) {
                    transitionDirection = 'next';
                    currentSlide++;
                    updateUI();
                }
            };

            window.prevSlide = function() {
                if (currentSlide > 0 && !isModalOpen) {
                    transitionDirection = 'prev';
                    currentSlide--;
                    updateUI();
                }
            };

            const container = document.getElementById('presentation-container');
            if (container && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                container.addEventListener('pointermove', e => {
                    const r = container.getBoundingClientRect();
                    const x = ((e.clientX - r.left) / r.width - .5) * 18;
                    const y = ((e.clientY - r.top) / r.height - .5) * 18;
                    const active = document.querySelector('.slide.active');
                    if (!active) return;
                    cancelAnimationFrame(raf);
                    raf = requestAnimationFrame(() => {
                        active.style.setProperty('--mx', `${x}px`);
                        active.style.setProperty('--my', `${y}px`);
                    });
                });
                container.addEventListener('pointerleave', () => {
                    const active = document.querySelector('.slide.active');
                    if (active) {
                        active.style.setProperty('--mx', '0px');
                        active.style.setProperty('--my', '0px');
                    }
                });
            }
        })();
    </script>
'''
          if 'polish layer: directional transitions + subtle mouse parallax' not in s:
              s = s.replace(script_marker, script + script_marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          rm -f .github/workflows/polish-presentation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/polish-presentation.yml
          git diff --cached --quiet && exit 0
          git commit -m "[auto-polish] add closing slide and smoother parallax transitions"
          git push
